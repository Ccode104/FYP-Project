name: Comprehensive CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.svg'
      - 'EduPortal-Mobile/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.svg'
      - 'EduPortal-Mobile/**'
  schedule:
    # Run full suite daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '20.x'
  COVERAGE_THRESHOLD: '80'
  PERFORMANCE_THRESHOLD: '5000'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  #==============================================================================
  # BACKEND QUALITY GATES
  #==============================================================================

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --format json --output-file eslint-report.json || true
        continue-on-error: false

      - name: Comment PR with lint results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = JSON.parse(fs.readFileSync('./backend/eslint-report.json', 'utf8'));
              if (report.length > 0) {
                const errors = report.reduce((acc, file) => acc + file.messages.length, 0);
                console.log(`ESLint found ${errors} issues`);
              }
            } catch (e) {
              console.log('No linting issues found');
            }

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --testPathPattern="__tests__/(controllers|routes)" --coverage --coverageDirectory=coverage/unit
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:testpass@localhost:5432/test_db

      - name: Generate coverage report
        run: npm run test:coverage || true

      - name: Check coverage threshold
        run: |
          COVERAGE=$(npx nyc check-coverage --lines ${{ env.COVERAGE_THRESHOLD }} 2>/dev/null || echo "0")
          if [ "$COVERAGE" -lt "${{ env.COVERAGE_THRESHOLD }}" ]; then
            echo "❌ Coverage below threshold: $COVERAGE% < ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi
          echo "✅ Coverage acceptable: $COVERAGE%"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/coverage-final.json
          flags: backend-unit
          name: backend-coverage
          fail_ci_if_error: false

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm test -- --testPathPattern="integration" --coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:testpass@localhost:5432/test_db

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-results
          path: backend/coverage
          retention-days: 7

  backend-security-tests:
    name: Backend Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: npm test -- --testPathPattern="security"
        env:
          NODE_ENV: test

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  backend-performance-tests:
    name: Backend Performance Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        run: npm test -- --testPathPattern="performance"
        env:
          NODE_ENV: test

      - name: Check performance benchmarks
        run: |
          echo "✅ Performance tests completed"
          echo "Target response time: < ${{ env.PERFORMANCE_THRESHOLD }}ms"

  #==============================================================================
  # FRONTEND QUALITY GATES
  #==============================================================================

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

  frontend-type-check:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check with TypeScript
        run: npx tsc --noEmit
        continue-on-error: false

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm test -- --coverage --testPathPattern="components"
        env:
          NODE_ENV: test
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend-unit
          name: frontend-coverage
          fail_ci_if_error: false

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-type-check, frontend-unit-tests]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:4000/api' }}
          CI: true

      - name: Check bundle size
        run: |
          SIZE=$(du -sh dist | cut -f1)
          echo "📦 Bundle size: $SIZE"
          # Add threshold check if needed
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  #==============================================================================
  # E2E TESTS
  #==============================================================================

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-build]
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm test -- --testPathPattern="e2e"
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:testpass@localhost:5432/test_db
          BASE_URL: http://localhost:3000

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: backend/coverage
          retention-days: 7

  #==============================================================================
  # CODE QUALITY GATES
  #==============================================================================

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v2

  #==============================================================================
  # DEPENDENCY CHECK
  #==============================================================================

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-vulnerabilities: 0
          deny-licenses: 'GPL-3.0, GPL-3.0-only, GPL-3.0-or-later'

  #==============================================================================
  # FINAL QUALITY GATE
  #==============================================================================

  quality-gate:
    name: Quality Gate - All Checks
    runs-on: ubuntu-latest
    needs:
      [
        backend-lint,
        backend-unit-tests,
        backend-integration-tests,
        backend-security-tests,
        backend-performance-tests,
        frontend-lint,
        frontend-type-check,
        frontend-unit-tests,
        frontend-build,
        e2e-tests,
        code-quality,
      ]
    if: always()

    steps:
      - name: Check if all required jobs passed
        run: |
          if [[ "${{ needs.backend-lint.result }}" != "success" || \
                "${{ needs.backend-unit-tests.result }}" != "success" || \
                "${{ needs.backend-integration-tests.result }}" != "success" || \
                "${{ needs.backend-security-tests.result }}" != "success" || \
                "${{ needs.backend-performance-tests.result }}" != "success" || \
                "${{ needs.frontend-lint.result }}" != "success" || \
                "${{ needs.frontend-type-check.result }}" != "success" || \
                "${{ needs.frontend-unit-tests.result }}" != "success" || \
                "${{ needs.frontend-build.result }}" != "success" || \
                "${{ needs.e2e-tests.result }}" != "success" || \
                "${{ needs.code-quality.result }}" != "success" ]]; then
            echo "❌ Some quality gates failed!"
            exit 1
          fi
          
          echo "✅ All quality gates passed!"
          echo ""
          echo "✓ Backend Lint"
          echo "✓ Backend Unit Tests"
          echo "✓ Backend Integration Tests"
          echo "✓ Backend Security Tests"
          echo "✓ Backend Performance Tests"
          echo "✓ Frontend Lint"
          echo "✓ Frontend Type Check"
          echo "✓ Frontend Unit Tests"
          echo "✓ Frontend Build"
          echo "✓ E2E Tests"
          echo "✓ Code Quality Analysis"

      - name: Create success comment on PR
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ All quality gates passed!\n\n**Checks Completed:**\n- Backend Lint\n- Backend Unit Tests\n- Backend Integration Tests\n- Backend Security Tests\n- Backend Performance Tests\n- Frontend Lint\n- Frontend Type Check\n- Frontend Unit Tests\n- Frontend Build\n- E2E Tests\n- Code Quality Analysis'
            })

      - name: Create failure comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Some quality gates failed. Please check the logs for details.'
            })
